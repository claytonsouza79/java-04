<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Hamburgueria carrinho de compras</title>
</head>

<body>

    <h2>Hamburgueria: carrinho de compras</h2>

    <button onclick="adicionarItem('X-burguer', 18)">X-burguer R$ 18</button>
    <button onclick="adicionarItem('X-salada', 15)">X-salada R$ 15</button>
    <button onclick="adicionarItem('X-especial', 20)">X-especial R$ 20</button>
    <button onclick="adicionarItem('Batata-frita', 8)">Batata R$ 8</button>
    <button onclick="adicionarItem('Refrigerante', 7)">Refrigerante R$ 7</button>
    <button onclick="adicionarItem('Sorvete', 9)">Sorvete R$ 9</button>

    <pre id="lista-carrinho"></pre>
    <b id="total">Total: R$ 0,00</b>

    <script>
        var carrinho = [];

        function adicionarItem(nome, preco) {
            carrinho.push({ nome: nome, preco: preco });
            atualizarCarrinho();
        }

        function atualizarCarrinho() {
            var total = 0;
            var lista = "";

            for (var i = 0; i < carrinho.length; i++) {
                total += carrinho[i].preco;
                lista += carrinho[i].nome + " - R$ " + carrinho[i].preco.toFixed(2) + "\n";
            }

            document.getElementById("lista-carrinho").innerText = lista;
            document.getElementById("total").innerText = "Total: R$ " + total.toFixed(2);
        }
    </script>

</body>

</html>
